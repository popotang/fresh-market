<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="965" viewBox="0 0 2000 965" role="img" aria-labelledby="title desc">
  <title id="title">改造后业务数据流转与人员使用</title>
  <desc id="desc">交易数据从超市收银进入科迈云帆 SaaS、私有化数据中心和云兔 AI 原生系统底座，再服务运营、管理人员、业务人员和 Skill 沉淀。</desc>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .ink { fill: #14284b; }
      .muted { fill: #53647d; }
      .card { fill: #ffffff; stroke: #6f9cc3; stroke-width: 3; }
      .flow-line { fill: none; stroke: #2f67b2; stroke-width: 4; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f67b2"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c77314"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c8588"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a3fa0"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c8759"/></marker>
  </defs>

  <rect width="2000" height="965" fill="#ffffff"/>
  <text x="154" y="125" class="ink" font-size="38" font-weight="700">改造后业务数据流转与人员使用</text>
  <text x="154" y="169" class="muted" font-size="24">交易数据进入云兔底座，转化为可执行的经营动作与可复用能力</text>
  <line x1="154" y1="196" x2="1912" y2="196" stroke="#c8d7e6" stroke-width="2"/>

  <!-- Main data chain -->
  <rect x="154" y="374" width="230" height="220" rx="22" class="card"/>
  <rect x="170" y="382" width="198" height="10" rx="5" fill="#2b63c6"/>
  <circle cx="269" cy="439" r="36" fill="#eaf3fc"/>
  <rect x="255" y="423" width="28" height="32" rx="4" fill="none" stroke="#24589f" stroke-width="3"/>
  <line x1="260" y1="432" x2="278" y2="432" stroke="#24589f" stroke-width="3"/>
  <line x1="260" y1="440" x2="278" y2="440" stroke="#24589f" stroke-width="3"/>
  <line x1="260" y1="448" x2="272" y2="448" stroke="#24589f" stroke-width="3"/>
  <text x="269" y="512" text-anchor="middle" class="ink" font-size="30" font-weight="700">超市收银</text>
  <text x="269" y="554" text-anchor="middle" class="muted" font-size="23">交易流水</text>

  <rect x="437" y="374" width="230" height="220" rx="22" class="card"/>
  <rect x="453" y="382" width="198" height="10" rx="5" fill="#1c8588"/>
  <circle cx="552" cy="439" r="36" fill="#eaf3fc"/>
  <path d="M532 449h38c10 0 17-6 17-14s-6-13-14-14c-2-11-11-18-22-18-13 0-23 9-25 21-9 1-15 6-15 13 0 7 8 12 21 12z" fill="none" stroke="#24589f" stroke-width="3" stroke-linejoin="round"/>
  <text x="552" y="512" text-anchor="middle" class="ink" font-size="28" font-weight="700">科迈云帆 SaaS</text>
  <text x="552" y="554" text-anchor="middle" class="muted" font-size="23">现有业务系统</text>

  <rect x="722" y="374" width="268" height="220" rx="22" class="card"/>
  <rect x="738" y="382" width="236" height="10" rx="5" fill="#6a3fa0"/>
  <circle cx="856" cy="439" r="36" fill="#eaf3fc"/>
  <ellipse cx="856" cy="426" rx="18" ry="8" fill="none" stroke="#24589f" stroke-width="3"/>
  <path d="M838 426v26c0 5 8 9 18 9s18-4 18-9v-26M838 439c0 5 8 9 18 9s18-4 18-9" fill="none" stroke="#24589f" stroke-width="3"/>
  <text x="856" y="512" text-anchor="middle" class="ink" font-size="28" font-weight="700">私有化数据中心</text>
  <text x="856" y="554" text-anchor="middle" class="muted" font-size="22">汇聚 · 治理 · 留存</text>

  <rect x="1042" y="346" width="292" height="274" rx="26" fill="#e9f3fc" stroke="#2e5b9b" stroke-width="3"/>
  <rect x="1062" y="358" width="252" height="10" rx="5" fill="#2c478f"/>
  <circle cx="1188" cy="427" r="38" fill="#ffffff" stroke="#8aa4c7" stroke-width="2"/>
  <circle cx="1188" cy="427" r="7" fill="#2f67b2"/>
  <circle cx="1188" cy="405" r="5" fill="#2f67b2"/>
  <circle cx="1169" cy="438" r="5" fill="#2f67b2"/>
  <circle cx="1207" cy="438" r="5" fill="#2f67b2"/>
  <circle cx="1205" cy="413" r="5" fill="#2f67b2"/>
  <path d="M1188 427v-16M1188 427l-14 8M1188 427l14 8M1188 427l13-11" stroke="#2f67b2" stroke-width="3"/>
  <text x="1188" y="503" text-anchor="middle" class="ink" font-size="32" font-weight="700">云兔 AI 原生</text>
  <text x="1188" y="547" text-anchor="middle" class="ink" font-size="32" font-weight="700">系统底座</text>
  <text x="1188" y="586" text-anchor="middle" class="muted" font-size="21">统一指标 · Agent · 权限</text>

  <line x1="384" y1="482" x2="430" y2="482" class="flow-line" marker-end="url(#arrow-blue)"/>
  <line x1="667" y1="482" x2="715" y2="482" class="flow-line" marker-end="url(#arrow-blue)"/>
  <line x1="990" y1="482" x2="1035" y2="482" class="flow-line" marker-end="url(#arrow-blue)"/>
  <line x1="1334" y1="482" x2="1402" y2="482" class="flow-line"/>
  <circle cx="1402" cy="482" r="9" fill="#2f67b2"/>
  <path d="M1402 482V276H1460" class="flow-line" marker-end="url(#arrow-orange)"/>
  <path d="M1402 482V456H1460" fill="none" stroke="#1c8588" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <path d="M1402 482V640H1460" fill="none" stroke="#6a3fa0" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M1402 482V823H1460" fill="none" stroke="#2c8759" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- Outcome 1 -->
  <rect x="1466" y="213" width="446" height="126" rx="22" class="card"/>
  <rect x="1483" y="225" width="412" height="10" rx="5" fill="#c77314"/>
  <circle cx="1510" cy="276" r="32" fill="#c77314"/>
  <text x="1510" y="288" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">1</text>
  <text x="1555" y="267" class="ink" font-size="29" font-weight="700">运营智能决策</text>
  <text x="1555" y="305" class="muted" font-size="23">选品 · 陈列 · 执行</text>

  <!-- Outcome 2 -->
  <rect x="1466" y="397" width="446" height="126" rx="22" class="card"/>
  <rect x="1483" y="409" width="412" height="10" rx="5" fill="#1c8588"/>
  <circle cx="1510" cy="460" r="32" fill="#1c8588"/>
  <text x="1510" y="472" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">2</text>
  <text x="1555" y="451" class="ink" font-size="29" font-weight="700">管理人员报表分析</text>
  <text x="1555" y="489" class="muted" font-size="23">经营趋势 · 异常归因</text>

  <!-- Outcome 3 -->
  <rect x="1466" y="578" width="446" height="126" rx="22" class="card"/>
  <rect x="1483" y="590" width="412" height="10" rx="5" fill="#6a3fa0"/>
  <circle cx="1510" cy="641" r="32" fill="#6a3fa0"/>
  <text x="1510" y="653" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">3</text>
  <text x="1555" y="632" class="ink" font-size="29" font-weight="700">大量业务人员</text>
  <text x="1555" y="670" class="muted" font-size="23">数据提取 · 辅助决策</text>

  <!-- Outcome 4 -->
  <rect x="1466" y="760" width="446" height="126" rx="22" class="card"/>
  <rect x="1483" y="772" width="412" height="10" rx="5" fill="#2c8759"/>
  <circle cx="1510" cy="823" r="32" fill="#2c8759"/>
  <text x="1510" y="835" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">4</text>
  <text x="1555" y="814" class="ink" font-size="29" font-weight="700">各类 Skill 自我沉淀</text>
  <text x="1555" y="852" class="muted" font-size="23">经验复用 · 持续迭代</text>
</svg>
